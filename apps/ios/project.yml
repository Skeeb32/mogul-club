name: MogulClub
options:
  bundleIdPrefix: com.mogulclub.development
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    GENERATE_INFOPLIST_FILE: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MogulClub:
    type: application
    platform: iOS
    sources: [MogulClub]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mogulclub.development
        INFOPLIST_KEY_CFBundleDisplayName: Mogul Club Demo
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
      configs:
        Debug:
          INFOPLIST_FILE: Config/Debug-Info.plist
        Release:
          INFOPLIST_FILE: Config/Release-Info.plist
  MogulClubTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MogulClubTests]
    dependencies:
      - target: MogulClub
  MogulClubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [MogulClubUITests]
    dependencies:
      - target: MogulClub
schemes:
  MogulClub:
    build:
      targets:
        MogulClub: all
    test:
      targets: [MogulClubTests, MogulClubUITests]
