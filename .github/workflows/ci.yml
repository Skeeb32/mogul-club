name: Foundation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm contracts && git diff --exit-code -- packages/api-contracts/openapi.json
      - run: pnpm audit --prod --audit-level high
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait --wait-timeout 240 mongodb postgres redis api admin
      - run: docker compose run --rm seed
      - run: curl --fail http://localhost:3001/api/v1/health && curl --fail http://localhost:3001/api/v1/properties && curl --fail http://localhost:3000
      - if: always()
        run: docker compose down
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.33.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22.23.4, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @mogul/contracts build && pnpm --filter @mogul/api build
      - name: Start synthetic API for the native network journey
        run: |
          mkdir -p .test-results
          node scripts/demo-api.mjs > .test-results/ios-api.log 2>&1 &
          echo $! > .test-results/ios-api.pid
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:3001/api/v1/properties > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: xcodebuild -project "Mogul Club.xcodeproj" -scheme "Mogul Club" -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
      - name: Run unit and UI tests on available iPhone simulator
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for devices in d["devices"].values() for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild -project "Mogul Club.xcodeproj" -scheme "Mogul Club" -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO test
      - name: Stop synthetic API
        if: always()
        run: |
          if test -f .test-results/ios-api.pid; then
            kill "$(cat .test-results/ios-api.pid)" || true
          fi
