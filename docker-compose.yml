services:
  mongodb:
    image: mongo:8.0.15
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_USER: mogul
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: mogul_ledger
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mogul -d mogul_ledger"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:8.2.1
    ports: ["127.0.0.1:6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment: &api-environment
      NODE_ENV: development
      DEMO_MODE: "true"
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-}
      PORT: "3001"
      MONGODB_URI: mongodb://mongodb:27017/mogul_demo
      POSTGRES_URL: postgresql://mogul:local-development-only@postgres:5432/mogul_ledger
      REDIS_URL: redis://redis:6379
    ports: ["127.0.0.1:3001:3001"]
    depends_on:
      mongodb: { condition: service_healthy }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 10
  seed:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: api
    environment: *api-environment
    command: ["node", "apps/api/dist/src/seed.js"]
    depends_on:
      mongodb: { condition: service_healthy }
  admin:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: admin
    environment:
      API_BASE_URL: http://api:3001
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
volumes:
  mongo-data:
  postgres-data:
  redis-data:
